[package]
name = "netlink-packet-wireguard"
version = "0.5.1"
authors = ["Leo <leo881003@gmail.com>", "Jake McGinty <me@jake.su>"]
edition = "2021"
homepage = "https://github.com/rust-netlink/netlink-packet-wireguard"
repository = "https://github.com/rust-netlink/netlink-packet-wireguard"
keywords = ["wireguard", "netlink", "linux"]
license = "MIT"
readme = "README.md"
description = "Wireguard generic netlink packet definitions"

[dependencies]
libc = "0.2.98"
log = "0.4.14"
netlink-packet-generic = { git = "https://github.com/rust-netlink/netlink-packet-generic", branch = "main" }
netlink-packet-core = "1.0.0-rc1"
bitflags = "2"

[dev-dependencies]
base64 = "0.22.1"
getrandom = "0.4.2"
netlink-sys = { version = "0.9" }
pretty_assertions = "1.4.1"
